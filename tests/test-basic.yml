name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          initial-delay-seconds: '0'
          period-seconds: '1'
          sha: bd2118bbaa84a24f15195facd5ff3ba19df7dbd7
      - name: Assert action ran (rollup-state set, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.rollup-state }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "SUCCESS" ] && [ "$RESULT" != "FAILURE" ]; then
              echo "FAIL: expected rollup-state SUCCESS or FAILURE"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
