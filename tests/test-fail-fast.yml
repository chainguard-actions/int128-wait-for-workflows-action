name: Test fail-fast mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'true'
          filter-workflow-events: push
        continue-on-error: true

      - name: Assert action completed (success or failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP_STATE"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
