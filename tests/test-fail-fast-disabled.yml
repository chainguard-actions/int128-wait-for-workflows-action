name: Test fail-fast disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          fail-fast: 'false'
          initial-delay-seconds: '1'
          period-seconds: '5'
          sha: 2875ef6993779fbdcabf6c04d6c66e1278042b0e
          token: ${{ github.token }}
      - name: Assert action ran with fail-fast disabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP" ]; then
              echo "FAIL: action succeeded but rollup-state output is empty"
              exit 1
            fi
            if [ "$ROLLUP" != "SUCCESS" ] && [ "$ROLLUP" != "FAILURE" ]; then
              echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP, failed-workflow-names=$FAILED_NAMES"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
