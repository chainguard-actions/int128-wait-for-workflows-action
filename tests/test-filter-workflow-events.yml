name: Test filter-workflow-events
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Filter to a specific event type — use workflow_dispatch which is the
          # current event so the action polls for workflow_dispatch runs on this SHA
          filter-workflow-events: |
            workflow_dispatch
          initial-delay-seconds: '1'
          period-seconds: '5'
          fail-fast: 'false'
          sha: ad266067e3fee2dc057098d6bfeb835d960d04d4
        continue-on-error: true
      - name: Assert rollup-state is valid with event filter
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "rollup-state: $ROLLUP_STATE"
          if [ -z "$ROLLUP_STATE" ]; then
            echo "FAIL: rollup-state output is empty"
            exit 1
          fi
          if [ "$ROLLUP_STATE" != "SUCCESS" ] && [ "$ROLLUP_STATE" != "FAILURE" ]; then
            echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP_STATE"
            exit 1
          fi
          echo "PASS: rollup-state=$ROLLUP_STATE"
