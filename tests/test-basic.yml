name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          initial-delay-seconds: '1'
          period-seconds: '5'
          filter-workflow-events: 'push'
          sha: e85220a0265fc3ebf3b6900baec84d151421cd48
      - name: Assert rollup-state output is set
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "rollup-state: $ROLLUP_STATE"
          if [ -z "$ROLLUP_STATE" ]; then
            echo "FAIL: rollup-state output is empty"
            exit 1
          fi
          echo "PASS: rollup-state=$ROLLUP_STATE"
      - name: Assert rollup-state is SUCCESS or FAILURE
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "rollup-state: $ROLLUP_STATE"
          if [ "$ROLLUP_STATE" != "SUCCESS" ] && [ "$ROLLUP_STATE" != "FAILURE" ]; then
            echo "FAIL: expected SUCCESS or FAILURE, got '$ROLLUP_STATE'"
            exit 1
          fi
          echo "PASS"
