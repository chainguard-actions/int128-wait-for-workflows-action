name: Test exclude-workflow-names input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          exclude-workflow-names: |
            Dependabot
            CodeQL
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'true'
          sha: 9a450f97d1691e51e7bdb037e44113ad9bd56dc6
      - name: Assert action ran with exclusion filter or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP_STATE"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP_STATE" ]; then
              echo "FAIL: action succeeded but rollup-state output is empty"
              exit 1
            fi
            if [ "$ROLLUP_STATE" != "SUCCESS" ] && [ "$ROLLUP_STATE" != "FAILURE" ]; then
              echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP_STATE"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP_STATE"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
