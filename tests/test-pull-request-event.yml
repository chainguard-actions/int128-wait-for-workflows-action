name: Test pull_request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Get current SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        with:
          sha: ${{ steps.sha.outputs.sha }}
          initial-delay-seconds: '0'
          period-seconds: '1'
          fail-fast: 'false'
          filter-workflow-events: pull_request
          token: ${{ github.token }}
        continue-on-error: true

      - name: Assert action completed
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped"
            exit 1
          fi
          echo "PASS: action completed"

      - name: Assert outputs are set
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "rollup-state: $ROLLUP_STATE"
          echo "failed-workflow-names: '$FAILED_NAMES'"
          # rollup-state should be set (either SUCCESS or empty if no check suites)
          if [ -n "$ROLLUP_STATE" ] && [ "$ROLLUP_STATE" != "SUCCESS" ] && [ "$ROLLUP_STATE" != "FAILURE" ]; then
            echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP_STATE"
            exit 1
          fi
          echo "PASS: outputs are valid"
