name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          initial-delay-seconds: '0'
          period-seconds: '1'
          sha: 541cbf5228f152af771c126e176492e6026a1cc6
      - name: Assert action ran (SUCCESS rollup, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $RESULT"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "SUCCESS" ]; then
              echo "FAIL: action succeeded but rollup-state is '$RESULT' (expected SUCCESS)"
              exit 1
            fi
            if [ -n "$FAILED_NAMES" ]; then
              echo "FAIL: action succeeded but failed-workflow-names is not empty"
              exit 1
            fi
            echo "PASS: rollup-state SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
