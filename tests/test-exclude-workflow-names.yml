name: Test exclude-workflow-names - excluded workflows return SUCCESS
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          # Exclude all workflows using a wildcard-like broad pattern so
          # the action finds no pending workflows and returns SUCCESS immediately.
          exclude-workflow-names: |
            *
          filter-workflow-events: workflow_dispatch
          fail-fast: 'true'
          initial-delay-seconds: '0'
          period-seconds: '5'
          sha: 0e537e6178889f2339a37912dce46d725583b668
      - name: Assert rollup-state is SUCCESS
        env:
          ACTUAL: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "actual rollup-state: $ACTUAL"
          if [ "$ACTUAL" != "SUCCESS" ]; then
            echo "FAIL: expected rollup-state to be 'SUCCESS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
      - name: Assert failed-workflow-names is empty
        env:
          ACTUAL: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "actual failed-workflow-names: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected failed-workflow-names to be empty, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
