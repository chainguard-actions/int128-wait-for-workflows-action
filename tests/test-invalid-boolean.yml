name: Test invalid boolean input fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          fail-fast: 'not-a-boolean'
          initial-delay-seconds: '0'
          period-seconds: '1'
          sha: 541cbf5228f152af771c126e176492e6026a1cc6
      - name: Assert action failed on invalid boolean
        env:
          OUTCOME: ${{ steps.action.outcome }}
          RESULT: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $RESULT"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for invalid boolean input"
            exit 1
          fi
          if [ -n "$RESULT" ]; then
            echo "FAIL: expected no rollup-state output"
            exit 1
          fi
          echo "PASS"
