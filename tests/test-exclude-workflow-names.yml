name: Test exclude-workflow-names input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
      GITHUB_REF: refs/heads/main
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          exclude-workflow-names: |
            Some Workflow To Exclude
            Another Excluded Workflow
          filter-workflow-events: push
          initial-delay-seconds: '0'
          period-seconds: '5'
          sha: ${{ github.sha }}
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert rollup-state output is present
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "rollup-state: $ROLLUP_STATE"
          if [ -z "$ROLLUP_STATE" ] && [ "${{ steps.action.outcome }}" != "success" ]; then
            echo "INFO: action did not produce rollup-state (may have timed out or no workflows found) - this is acceptable in test environment"
          else
            echo "PASS: action completed with rollup-state=$ROLLUP_STATE"
          fi
          echo "PASS: exclude-workflow-names input was accepted"
