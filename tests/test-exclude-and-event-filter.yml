name: Test exclude-workflow-names and filter-workflow-events inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          exclude-workflow-names: |
            Dependabot
            CodeQL
          filter-workflow-events: |
            push
            pull_request
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'false'
          sha: 34fbedf1d8e6c06104bf26c12dac654c8243ccdf
      - name: Assert action ran with exclude/event-filter inputs or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP" ]; then
              echo "FAIL: action succeeded but rollup-state output is empty"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
