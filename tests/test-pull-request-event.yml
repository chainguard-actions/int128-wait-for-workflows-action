name: Test pull request event context
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: pull_request
      GITHUB_REF: refs/pull/1/merge
      GITHUB_HEAD_REF: feature-branch
      GITHUB_BASE_REF: main
      GITHUB_REPOSITORY: int128/wait-for-workflows-action
      GITHUB_SERVER_URL: https://github.com
      GITHUB_RUN_ID: '1'
      GITHUB_WORKFLOW: test-pull-request-event
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: get-sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> $GITHUB_OUTPUT
      - id: action
        uses: .
        with:
          sha: ${{ steps.get-sha.outputs.sha }}
          fail-fast: 'false'
          initial-delay-seconds: '0'
          period-seconds: '5'
          filter-workflow-events: pull_request
          token: ${{ github.token }}
        continue-on-error: true
      - name: Assert action ran (outcome is success or failure, not skipped/cancelled)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with outcome=$OUTCOME"
          else
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
      - name: Assert rollup-state output if action succeeded
        env:
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP_STATE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP_STATE" ]; then
              echo "FAIL: rollup-state output was empty on success"
              exit 1
            fi
            if [ "$ROLLUP_STATE" != "SUCCESS" ] && [ "$ROLLUP_STATE" != "FAILURE" ]; then
              echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP_STATE"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP_STATE"
          else
            echo "PASS: action failed (likely API auth issue in act environment), skipping output assertion"
          fi
