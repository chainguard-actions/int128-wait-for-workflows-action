name: Test exclude workflow names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          exclude-workflow-names: |
            Dependabot
            CodeQL
          initial-delay-seconds: '0'
          period-seconds: '5'
          sha: b320164b37276db89a12829914d6eb6ef4973d2b
          token: ${{ github.token }}
      - name: Assert action ran with workflow name exclusion
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP: ${{ steps.action.outputs.rollup-state }}
          FAILED_ANNOTATIONS: ${{ steps.action.outputs.failed-workflow-annotations }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP"
          echo "failed-workflow-annotations: $FAILED_ANNOTATIONS"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP" ]; then
              echo "FAIL: action succeeded but rollup-state output is empty"
              exit 1
            fi
            if [ "$ROLLUP" != "SUCCESS" ] && [ "$ROLLUP" != "FAILURE" ]; then
              echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
