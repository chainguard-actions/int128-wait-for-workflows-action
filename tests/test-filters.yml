name: Test filters and explicit sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get HEAD sha
        id: head
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          sha: 541cbf5228f152af771c126e176492e6026a1cc6
          filter-workflow-names: |
            build*
            test*
          exclude-workflow-names: |
            *deploy*
          filter-workflow-events: |
            push
            pull_request
          fail-fast: 'false'
          initial-delay-seconds: '0'
          period-seconds: '1'
          page-size-of-check-suites: '10'
      - name: Assert action ran (SUCCESS rollup, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $RESULT"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "SUCCESS" ]; then
              echo "FAIL: action succeeded but rollup-state is '$RESULT' (expected SUCCESS)"
              exit 1
            fi
            if [ -n "$FAILED_NAMES" ]; then
              echo "FAIL: action succeeded but failed-workflow-names is not empty"
              exit 1
            fi
            echo "PASS: rollup-state SUCCESS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
