name: Test filter workflow names
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        with:
          sha: ${{ github.sha }}
          token: ${{ github.token }}
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'false'
          filter-workflow-events: push
          filter-workflow-names: |
            CI
            Build
        continue-on-error: true

      - name: Assert action completed with valid outcome
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP_STATE: ${{ steps.action.outputs.rollup-state }}
          FAILED_NAMES: ${{ steps.action.outputs.failed-workflow-names }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP_STATE"
          echo "failed-workflow-names: $FAILED_NAMES"
          if [ "$OUTCOME" != "success" ] && [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: unexpected outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action completed with outcome=$OUTCOME"
