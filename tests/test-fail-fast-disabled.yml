name: Test fail-fast disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          sha: 456c3b39b5e122319b40ffad07b8179731f8291c
          token: ${{ github.token }}
          # Filter to a workflow name that doesn't exist so we get immediate SUCCESS
          filter-workflow-names: __nonexistent_workflow_name__
          filter-workflow-events: workflow_dispatch
          fail-fast: 'false'
          initial-delay-seconds: '0'
          period-seconds: '5'
      - name: Assert rollup-state is SUCCESS
        env:
          ACTUAL: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "actual rollup-state: $ACTUAL"
          if [ "$ACTUAL" != "SUCCESS" ]; then
            echo "FAIL: expected rollup-state to be 'SUCCESS', got '$ACTUAL'"
            exit 1
          fi
          echo "PASS"
