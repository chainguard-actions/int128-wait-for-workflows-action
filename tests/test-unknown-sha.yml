name: Test explicit nonexistent sha
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        timeout-minutes: 5
        with:
          sha: 30773005c6cb51df47a6b3d85fc8602fcf717894
          initial-delay-seconds: '0'
          period-seconds: '1'
      - name: Assert action ran (outputs set, or failed gracefully)
        env:
          RESULT: ${{ steps.action.outputs.rollup-state }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ "$RESULT" != "SUCCESS" ] && [ "$RESULT" != "FAILURE" ]; then
              echo "FAIL: expected rollup-state SUCCESS or FAILURE, got '$RESULT'"
              exit 1
            fi
            echo "PASS: got '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo / unknown commit)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
