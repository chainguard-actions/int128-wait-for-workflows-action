name: Test filter-workflow-names input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          filter-workflow-names: |
            CI
            Build
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'false'
          sha: 78ec5cc01a1e58485768a6f2002f55692b071d57
      - name: Assert action ran with filter-workflow-names or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          ROLLUP: ${{ steps.action.outputs.rollup-state }}
        run: |
          echo "outcome: $OUTCOME"
          echo "rollup-state: $ROLLUP"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$ROLLUP" ]; then
              echo "FAIL: action succeeded but rollup-state output is empty"
              exit 1
            fi
            if [ "$ROLLUP" != "SUCCESS" ] && [ "$ROLLUP" != "FAILURE" ]; then
              echo "FAIL: rollup-state must be SUCCESS or FAILURE, got: $ROLLUP"
              exit 1
            fi
            echo "PASS: rollup-state=$ROLLUP"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
