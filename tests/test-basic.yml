name: Test basic usage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          initial-delay-seconds: '0'
          period-seconds: '5'
          fail-fast: 'false'
          token: ${{ github.token }}
          sha: ${{ github.sha }}
          filter-workflow-events: push
        continue-on-error: true
      - name: Assert step ran (outcome is success or failure, not skipped)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: step was skipped unexpectedly"
            exit 1
          fi
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: outcome was empty"
            exit 1
          fi
          echo "PASS: step ran with outcome=$OUTCOME"
